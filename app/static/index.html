<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>meercal</title>
  <meta name="theme-color" content="#1d6ff2" />
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg" />
  <link rel="stylesheet" href="/static/css/cal.css" />
  <!-- In <head> and blocking on purpose: it sets the theme attribute on <html>
       before the first paint, so a forced theme never flashes the other one. -->
  <script src="/static/js/app.theme.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-toolbar">
        <span class="brand"><img class="brand-logo" src="/static/img/logo.svg" alt="" />meercal</span>
        <button class="icon-btn" id="btn-refresh" title="Sync now — ask the agent for a pass (.)">↻</button>
      </div>
      <div class="sidebar-tools">
        <button class="icon-btn" id="btn-theme" title="Light, dark, or follow the system">◐</button>
      </div>

      <!-- Only shown when an account has stopped syncing. A calendar that is
           quietly not updating looks exactly like a calendar with nothing in
           it, which is the one failure a calendar must not have. -->
      <button class="agent-warning" id="agent-warning" hidden></button>

      <nav class="cal-tree" id="cal-tree"></nav>

      <!-- Generated by app.keys.js from the binding table itself. -->
      <div class="shortcut-box" id="shortcut-box"></div>
    </aside>

    <section class="main">
      <header class="toolbar">
        <button class="btn" id="btn-today" title="Today (t)">Today</button>
        <div class="nav-pair">
          <button class="icon-btn" id="btn-prev" title="Back (←)">‹</button>
          <button class="icon-btn" id="btn-next" title="Forward (→)">›</button>
        </div>
        <h1 class="view-title" id="view-title"></h1>
        <span class="hidden-note" id="hidden-note" hidden></span>
        <div class="grow"></div>
        <!-- Ribbon first, and first in the key order too: it is the view this
             program is for, and the other three are the familiar ones kept
             because they are still the right drawing for some questions. -->
        <div class="view-switch">
          <button data-view="ribbon" title="Ribbon — continuous days, long events in one piece (r)">Ribbon</button>
          <button data-view="week" title="Week (w)">Week</button>
          <button data-view="month" title="Month (m)">Month</button>
          <button data-view="day" title="Day (d)">Day</button>
        </div>
        <button class="btn primary" id="btn-new" title="New event (n)">New</button>
      </header>

      <div class="filter-region">
        <div class="filter-bar">
          <span class="filter-icon">⌕</span>
          <!-- `text`, not `search`: Chromium draws its own clear button inside a
               search input, and two crosses side by side is one too many. -->
          <input type="text" id="filter-input" autocomplete="off"
                 placeholder="Filter these calendars — words, cal:family, with:anna, is:span · Enter searches all of them" />
          <button class="icon-btn" id="filter-clear" title="Clear" hidden>✕</button>
          <label class="rx-toggle" title="Match with a POSIX regular expression">
            <input type="checkbox" id="regex-toggle" /> <span>Regex</span>
          </label>
        </div>
        <div class="filter-help" id="filter-help"></div>
        <div class="search-results" id="search-results" hidden></div>
      </div>

      <div id="stage" class="ribbon"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="login-overlay" hidden>
    <form class="modal-card small" id="login-form">
      <div class="modal-head"><span class="modal-title">meercal</span></div>
      <div class="modal-body">
        <label class="fld">
          <span class="fld-label">Password</span>
          <input class="in" type="password" id="login-password" autocomplete="current-password" />
        </label>
        <div class="modal-error" id="login-error" hidden></div>
      </div>
      <div class="modal-foot">
        <span class="grow"></span>
        <button class="btn primary" type="submit">Sign in</button>
      </div>
    </form>
  </div>

  <script src="/static/js/app.core.js"></script>
  <script src="/static/js/app.ribbon.js"></script>
  <script src="/static/js/app.week.js"></script>
  <script src="/static/js/app.month.js"></script>
  <script src="/static/js/app.editor.js"></script>
  <script src="/static/js/app.search.js"></script>
  <script src="/static/js/app.keys.js"></script>
  <script src="/static/js/app.shell.js"></script>
  <script src="/static/js/app.boot.js"></script>
</body>
</html>
