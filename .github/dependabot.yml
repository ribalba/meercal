# Dependency updates, opened as pull requests.
#
# This file turns on *version* updates: a weekly pass that notices a pin has
# fallen behind and offers the bump. Security updates are a separate switch, in
# Settings -> Code security, and they are the half that matters most here --
# they open a PR the day an advisory lands rather than waiting for Monday.
# Turn both on; this file cannot.
#
# Both requirements files pin exactly, and they overlap. `core` is shared, so
# `requirements.txt` and `agent/requirements.txt` name several of the same
# packages and must stay in step. CI installs both in one pip call, and two
# different pins for one package fail that install before any test runs.
#
# That is why there is a single pip entry for "/" and none for "/agent". The pip
# updater also reads the requirements files one directory down, so the "/" entry
# already bumps agent/requirements.txt in the same pull request. A separate
# "/agent" entry only added agent-only pull requests. Every package in the agent
# file is shared, so each of those fails CI on its own, as #15 did.
#
# Minor and patch updates are grouped into one pull request per ecosystem,
# because twenty separate ones a week is how a project learns to ignore them.
# Majors are deliberately left ungrouped: they arrive alone, because they are
# the ones that need reading rather than merging.

version: 2

updates:
  # --- Python ---------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"                      # requirements.txt and agent/requirements.txt
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Electron shell -------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "electron"]
    commit-message:
      prefix: "deps"
    groups:
      electron-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Base images ----------------------------------------------------------
  # The FROM lines only: python:3.13-slim in the two service images, and
  # nginx:1.27-alpine in the website. A major here is a runtime change, which
  # is exactly why it should arrive as its own pull request.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/agent"
      - "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"
    groups:
      base-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
