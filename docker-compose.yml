# The project name is set explicitly, and is not the directory name. Compose
# derives it from the directory otherwise, and `meercal.sh` installs into
# ~/.meercal: that strips to "meercal", the same name a checkout in a directory
# called meercal gets. Two stacks with one name share containers and, worse,
# share the database volume — the dev stack then meets a database initialised
# with the install's password, Postgres skips initialisation on a non-empty
# directory, and every connection fails to authenticate. A name of its own also
# means `down -v` in here cannot take your real calendars with it.
name: meercal-dev

services:
  db:
    image: postgres:18
    # A calendar is small: years of twenty calendars is tens of megabytes, not
    # the tens of gigabytes meerail's mail store runs to. The defaults are
    # therefore left alone here. This is the one place in the suite where
    # Postgres does not need tuning.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meercal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meercal}
      POSTGRES_DB: ${POSTGRES_DB:-meercal}
    networks:
      meercal:
        # "db" is what compose calls this on its own network, and it is also
        # what meerail calls *its* Postgres on meerail's. A server attached to
        # both (see docker-compose.meerail.yml) asks Docker's resolver for "db"
        # and gets whichever answers -- in practice meerail's, at which point
        # meercal is reading its calendars out of a mail database. So the two
        # halves of the suite address each other by names that are unique
        # across it, and nothing here depends on "db" resolving to anything.
        aliases: [meercal-db]
    ports:
      # On the host's loopback so the agent, which runs natively beside your
      # credentials, can reach it. The 127.0.0.1 prefix is load-bearing: drop
      # it and Docker publishes on 0.0.0.0, straight through the host firewall
      # to a database with the default password.
      #
      # 5433, not 5432: meerail's stack already has that one.
      - "127.0.0.1:${MEERCAL_DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql (not .../data);
      # this layout is what allows an in-place `pg_upgrade --link` later.
      - meercal-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meercal} -d ${POSTGRES_DB:-meercal}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    build: .
    image: meercal-server:local
    # The config file is mode 0600 on the host and holds calendar passwords, so
    # the container has to run as the user that owns it: a bind mount carries
    # the host's ownership through, and the image's own unprivileged user
    # cannot read it. meercal.sh writes these ids into .env; `make hub-up`
    # passes the current user's. Running as root instead would read it, and is
    # what the sibling projects do, but there is nothing in here that needs to.
    user: "${MEERCAL_UID:-10001}:${MEERCAL_GID:-10001}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Container topology only. Everything else comes from meercal.toml, which
      # is why nothing here sets a value it does not mean. An entry with a
      # ${VAR:-default} fallback is always set, and would override the file.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meercal}:${POSTGRES_PASSWORD:-meercal}@meercal-db:5432/${POSTGRES_DB:-meercal}
      # Which zone the calendar is drawn in, when meercal.toml says "system".
      # Topology in the same sense as the line above: a container's own system
      # zone is UTC, and "system" without this means "UTC", not "yours" -- every
      # timed event an hour or two out, in a way that looks perfectly plausible
      # on screen. Empty is read as "not set" and falls back to the container's
      # own zone, so this cannot override a zone named in meercal.toml.
      TZ: ${TZ:-}
    volumes:
      # Read-only: the server reads its settings and never writes them.
      - ./meercal.toml:/app/meercal.toml:ro
    networks:
      meercal:
    ports:
      - "${MEERCAL_BIND:-127.0.0.1}:${MEERCAL_PORT:-8010}:8000"
    restart: unless-stopped

  agent:
    # The same three containers an install runs, so that `docker compose up`
    # here is the thing meercal.sh deploys and not a subset of it. The one
    # difference from the hub file is this build: the image comes from the
    # tree, not from Docker Hub, which is what makes an edit to agent/ testable
    # without a release. Running it natively with `make agent` is still the
    # faster loop for one connector, and still the only way to reach the host:
    # OAuth (`python -m agent.google_auth`, which catches a redirect on
    # 127.0.0.1) and desktop reminders (`notify-send` needs your session) do
    # not work from in here.
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: meercal-agent:local
    # Reads meercal.toml, so it runs as the user who owns it; see server above.
    # The agent is stricter than the server about it: it exits rather than run
    # on a config other users can read, so the file has to be mode 0600 and
    # MEERCAL_UID has to be yours. `make up` and meercal.sh pass them; a bare
    # `docker compose up` takes them from .env.
    user: "${MEERCAL_UID:-10001}:${MEERCAL_GID:-10001}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # As on the server: topology only. The url in meercal.toml is the one for
      # an agent run from the host, and points at the published port; this
      # overrides it with the address the compose network uses.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meercal}:${POSTGRES_PASSWORD:-meercal}@meercal-db:5432/${POSTGRES_DB:-meercal}
      # The agent needs it for the same reason the server does, and for one of
      # its own: a reminder says what time the meeting is at.
      TZ: ${TZ:-}
    volumes:
      # Read-only, and the only copy of your credentials in the stack.
      - ./meercal.toml:/app/meercal.toml:ro
    networks:
      meercal:
    # No ports: the agent reaches out and nothing reaches in.
    restart: unless-stopped

networks:
  meercal:

volumes:
  meercal-db:
