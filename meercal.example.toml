# meercal configuration: one file for the whole system.
#
#   cp meercal.example.toml meercal.toml && chmod 600 meercal.toml
#
# Both processes read this same file: the web app takes [database] and
# [server], the agent takes [database] and [agent]. Each ignores the other's
# section, so a machine running only one of them leaves the rest at its default.
#
# EVERY setting here can be overridden by an environment variable of the same
# name in upper case: server.password is SERVER_PASSWORD, database.url is
# DATABASE_URL. The environment wins over this file, and a .env beside it sits
# between the two:
#
#   environment  >  .env  >  meercal.toml  >  built-in default
#
# That order is what lets a remote server run with no file at all.
#
# This file holds calendar passwords in plaintext. Keep it mode 0600; the
# agent's --test refuses to pass if anyone else can read it.


# --- database -----------------------------------------------------------------
# The only channel between the agent and the web app.
[database]
# Port 5433, not 5432: meerail's Postgres already has that one and the two
# stacks are meant to run side by side on the same laptop.
url = "postgresql+psycopg://meercal:meercal@127.0.0.1:5433/meercal"


# --- server -------------------------------------------------------------------
[server]
# Encrypts stored credentials and signs session cookies.
# CHANGE THIS. Generate: python -c "import secrets;print(secrets.token_urlsafe(48))"
secret_key = "dev-insecure-secret-change-me"

# Password gating the web UI / REST API. Empty = open, which is right for a
# localhost install; set it before exposing the server. Setting it also turns on
# the HTTPS requirement for everything that is not loopback.
password = ""

# The zone the calendar is drawn in. Everything is stored in UTC; this is only
# how it is displayed, and the one exception is all-day events, which are dates
# and never move between zones.
#
# "system" means the machine the *server* runs on, which in Docker is the
# container -- and a container's own zone is UTC. Compose passes the host's
# zone in as TZ for exactly this reason (see .env), but if you run the server
# some other way and the times come out an hour or two off, name the zone here
# instead: it is the one answer nothing can misread.
#
#   timezone = "Europe/Berlin"
#
# The UI says so when it notices: a note in the toolbar appears whenever the
# zone drawn in is not the zone your browser is in.
timezone = "system"

# 1 = Monday (ISO 8601), 7 = Sunday. Also decides where the week rules fall in
# the Ribbon view and which column the month grid starts on.
week_start = 1

# The hours you keep. The week and day grids grey everything outside them and
# open on the part of the day you work in, so the working day is what the eye
# lands on. Nothing is hidden by it: the grid still runs midnight to midnight,
# an event at six in the morning is drawn in its own place, and a drag through
# the greyed hours means what it means anywhere else.
day_start = 8
day_end = 20

# Which view opens on a cold start: ribbon | week | month | day.
default_view = "ribbon"

# How far either side of today occurrences are materialised. Recurrence is
# expanded into rows so a range query stays one index scan no matter how many
# calendars are shown (see core/expand.py); this is how much of it exists at
# any moment. The window rolls forward as you scroll past its edge.
horizon_past_days = 730
horizon_future_days = 1095

# Trusted reverse proxies, if TLS is terminated in front of this. Without it
# every request looks like it came from the proxy.
trusted_proxies = []

# Once a day, ask github whether a newer meercal is out, and show a quiet strip
# in the sidebar if so. This is the *only* outbound request the server makes;
# false means it makes none at all, ever, not that the banner is hidden.
update_check = true

# Places you type over and over, offered as chips under the event panel's
# "Where" field. The key is the label on the chip; the value is what goes into
# the field, so it can be an address, a room, or a meeting link.
#
# In the order written here, which is the order they are offered in. Leave the
# table out and the field is simply a text field.
[server.places]
# "Office" = "Ritterstr. 12, 10969 Berlin"
# "Meet" = "https://meet.google.com/abc-defg-hij"
# "Kita" = "Kita Sonnenschein, Reichenberger Str. 1"
# "Home" = "Home"


# --- meerail ------------------------------------------------------------------
# The mail side of the suite. Optional, and read-only: meercal never writes to
# meerail's database. With this set, the attendee field autocompletes from the
# people you actually correspond with (meerail's `contacts` table), and mail
# carrying an invitation can be turned into an event.
[meerail]
database_url = ""


# --- reminders ----------------------------------------------------------------
# The one part of meercal that speaks first.
#
# Only the agent reads this section: it is the half that holds credentials and
# the half that has a session bus, and a container can neither show you a
# desktop notification nor be trusted with a Twilio token. The scheduler runs
# beside the sync loop (or alone: `python -m agent.remind`).
#
# Two commands are worth knowing before you write any of it:
#
#   python -m agent.remind --test       one real notification per channel
#   python -m agent.remind --next 24h   what would fire, and what is muted
#
# The second is the dry run that makes a config change safe to make at 23:00,
# and the answer to "why didn't it ring".
[reminders]
# A kill switch. Leaving it out changes nothing: with no rules below, the loop
# is never started in the first place.
enabled = true

# Seconds between passes. Cheap (a pass with nothing due is two indexed
# queries), so this is about how precise a reminder feels, not about load.
tick = 30

# How late a reminder may still be delivered. A laptop suspended at 08:40 and
# opened at 09:40 has an armed 09:00 reminder waiting: inside this window it
# fires and says it is late, outside it it is recorded as missed rather than
# silently vanishing. A phone call gets a much shorter one of its own.
grace = 600

# Local wall time. Held by meercal rather than left to the desktop, because a
# `critical` notification bypasses Plasma's Do Not Disturb by design, which is
# the urgency a reminder wants, so the rule has to live here. A reminder whose
# *event* falls inside the window still fires; one that would merely arrive
# inside it is held until the window ends. A channel can opt out entirely.
# quiet_hours = "23:00-07:00"

# Where "before" starts for an event with no clock on it. "Ten minutes before"
# is meaningless for a birthday; this gives every all-day event a notional time
# for lead times to be measured from.
all_day_at = "09:00"

# This dispatcher's name, matched against a channel's `host`. Defaults to the
# machine's own hostname. Two machines can share one database: the desktop
# notification has to happen where you are sitting, the phone call does not.
# host = "thinkpad"

# How long delivered and missed reminders are kept, for the UI to show.
retention_days = 30


# --- channels ---
# Where a reminder goes. One block per destination; a rule names them by the
# table key, so [reminders.channel.desk] is "desk".
#
# Every channel takes these, whatever it sends over:
#   enabled, host, detail, max_per_day, ignore_quiet_hours, grace, title, body
#
# `title` and `body` are templates over {summary} {when} {start} {location}
# {calendar} {description}, plus {calendar_suffix} and {location_suffix} which
# render as " · Family" and "" respectively, so one template reads correctly
# whether or not the field is set.

# A notification on this machine, through notify-send.
#
# This one is tied to a machine in a way the others are not, and meercal knows
# it: a dispatcher with no session bus (an agent in a container, or under a
# systemd *system* unit) will not claim these reminders at all, and leaves
# them in the queue for the desktop that can actually show them. Set `host` if
# you have more than one machine that could.
[reminders.channel.desk]
kind = "desktop"
# `critical` is the one that matters: on Plasma and GNOME it means the
# notification does not expire on its own. A reminder that fades after four
# seconds while you are looking at another screen has reminded nobody.
urgency = "critical"
# A canberra event name, a path to a sound file, or "" for silence.
sound = "message"
# icon = "/usr/share/icons/hicolor/128x128/apps/meercal.png"

# A push to a phone, over ntfy. https://ntfy.sh, or your own.
#
# READ THIS BEFORE POINTING IT AT ntfy.sh: a public topic is readable by anyone
# who knows or guesses its name, and what goes over it is the titles of your
# appointments. Make the topic long and random rather than "meercal-didi", and
# consider `detail`. Self-hosting ntfy with auth is the real answer.
# [reminders.channel.phone]
# kind = "ntfy"
# server = "https://ntfy.sh"
# topic = "meercal-7f3a91c4e05b"     # long and random: the topic IS the password
# token_env = "NTFY_TOKEN"           # read from the environment, not written here
# priority = 4                       # 1-5; 5 can break through a phone's DND
# tags = ["calendar"]
# # full   title, time, calendar and place
# # title  the title and the time, nothing else
# # none   "a reminder", and you open the app to see what it was
# detail = "full"
# # Where tapping it goes. Only useful if the phone can actually reach meercal.
# click = "http://127.0.0.1:8010/"

# A phone call. Twilio's Calls endpoint takes the TwiML inline, so this needs
# no publicly reachable webhook: one authenticated POST and nothing exposed.
#
# This is the channel that costs money and wakes people. Run
# `python -m agent.remind --test` before any rule points at it: it verifies the
# credentials without placing a call.
# [reminders.channel.call]
# kind = "twilio"
# account_sid = "AC…"
# auth_token_env = "TWILIO_AUTH_TOKEN"   # keep the token out of this file
# from = "+4930…"                        # a number you own on Twilio
# to = "+49170…"
# mode = "call"                          # or "sms"
# say = "{summary}. {when}."
# voice = "Polly.Vicki"
# language = "de-DE"
# repeat = 2                    # a sentence heard once, half asleep, is not heard
# max_per_day = 6               # a hard stop, because this one has a bill
# ignore_quiet_hours = true     # the point of a call is that it wakes you
# grace = 300                   # a call about a meeting that ended is worse than none

# A notification in the meercal window, while it is open. Claimed by the
# browser from the same queue as everything else, so it composes with the rest
# rather than being a second way for a reminder to happen. The only channel
# that works on a machine where the agent is not running.
# [reminders.channel.window]
# kind = "app"

# The escape hatches. Between them they cover Home Assistant, a smart bulb,
# signal-cli, and whatever comes next.
# [reminders.channel.lamp]
# kind = "command"
# # The reminder arrives in the environment: MEERCAL_SUMMARY, MEERCAL_WHEN,
# # MEERCAL_START, MEERCAL_CALENDAR, MEERCAL_LOCATION, MEERCAL_TITLE.
# argv = ["/home/you/bin/flash-the-lamp"]
#
# [reminders.channel.hass]
# kind = "webhook"
# url = "http://homeassistant.local:8123/api/webhook/meercal"
# token_env = "HASS_TOKEN"


# --- rules ---
# Which events get a reminder, how long before, and on what.
#
# `match` is a filter string in exactly the language the filter bar takes,
# `cal:work is:busy with:anna in:berlin`, so there is nothing new to learn,
# and a rule can be worked out by typing it into the bar and looking.
#
# Order does not matter: every rule is evaluated, and two rules asking for the
# same moment on the same channel produce one reminder, not two.

# [[reminders.rule]]
# name = "everything, on screen"
# match = ""                     # empty matches every event
# lead = "10m"
# channels = ["desk"]
#
# [[reminders.rule]]
# name = "work, on the phone too"
# match = "cal:work is:busy"
# except = "Lunch"               # subtracted from the match; see below
# lead = ["1h", "10m"]           # a list arms one reminder per entry
# channels = ["desk", "phone"]
#
# [[reminders.rule]]
# name = "birthdays, the evening before"
# match = "is:allday cal:birthdays"
# at = "-1d 18:00"               # an absolute wall clock, not a lead time
# channels = ["phone"]
#
# [[reminders.rule]]
# name = "whatever the server said"
# match = "cal:shared"
# lead = "valarm"                # defer to the event's own VALARM, so meercal
# channels = ["desk"]            # agrees with the alarm your phone already set
#
# Also available on a rule:
#   regex = true            hand `match` to Postgres as a POSIX pattern
#   visible_only = true     skip calendars that are switched off. Off by
#                           default: hiding a calendar is about drawing it,
#                           not about the data, and the same is true of search.


# --- the last word ------------------------------------------------------------
# A rule is a statement about a *kind* of event, and there is always an event
# that is the wrong kind. A daily "Lunch" matches `cal:work is:busy` as squarely
# as a client meeting does, and no filter string can see the difference.
#
# So the event wins. The bell in the event panel sets a channel to one of three
# things, and **auto is not the same as on**:
#
#   auto   whatever the rules say: the default, and it follows a rule you
#          write next month
#   on     always, whether or not a rule matched
#   off    never, including against rules that do not exist yet
#
# "Never call me about lunch" is therefore one bit that stays true, and the
# desktop popup still arrives because only the call was muted. For a shape of
# event rather than one event, anything called Lunch on any calendar forever,
# `except` on the rule is the better place.
#
# Resolved in this order, and `off` beats `on`:
#
#   1  this occurrence     the panel, "This event only"
#   2  the whole series    the panel, "All events"
#   3  the event's VALARM  only for a rule with lead = "valarm"
#   4  matching rules      here
#   5  nothing fires


# --- agent --------------------------------------------------------------------
# Only the agent reads this section. It is the only place calendar credentials
# are configured, and it never leaves your machine.
[agent]
# Seconds between sync passes. CalDAV servers hand out sync tokens, so a pass
# with nothing new costs one request per calendar.
interval = 300

# One block per calendar account. Repeat [[agent.account]] for as many as you
# have: the whole point of this program is that there are a lot of them. When
# you copy one of the blocks below, uncomment its [[agent.account]] header too:
# the fields without it are keys of [agent], and configure nothing.
#
# kind = "icloud"    Apple Calendar, shared with your family. Requires an
#                    app-specific password from appleid.apple.com; your normal
#                    password will not work, and neither will 2FA prompts.
# kind = "google"    Google Calendar over CalDAV. An app password will *not*
#                    open this one: basic auth to Google's CalDAV endpoint has
#                    been off for years, so it takes an OAuth client of your
#                    own and a refresh token. `meercal.sh google-auth`, or
#                    `python -m agent.google_auth` from a checkout, mints one
#                    and prints the block to paste.
# kind = "caldav"    anything else: Nextcloud, Fastmail, Radicale, SOGo.
#
# [[agent.account]]
# label = "Family"
# kind = "icloud"
# username = "you@icloud.com"
# password = "abcd-efgh-ijkl-mnop"      # app-specific password
# # url is filled in from `kind` for icloud/google; set it for plain caldav.
# # url = "https://cloud.example.com/remote.php/dav"
#
# # Optional: only sync some of the calendars this account offers. Regex,
# # matched against the calendar's display name. Left out, everything is synced
# # and you hide what you do not want in the UI.
# # only = "Family|Kita"
#
# [[agent.account]]
# label = "Work"
# kind = "google"
# username = "you@example.com"
# # The three that `google_auth` prints. No `password` field: Google does not
# # take one here. `username` is not a credential, it is which account's CalDAV
# # principal to start discovery at.
# client_id = "1234-abcd.apps.googleusercontent.com"
# client_secret = "GOCSPX-…"
# refresh_token = "1//0…"
